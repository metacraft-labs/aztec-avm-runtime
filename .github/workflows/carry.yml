name: Downstream carry

# The recurring cost of carrying patches upstream has not taken is invisible
# until the day it is expensive. This job makes it a dated failure instead: it
# replays the whole ordered carry set onto a fresh fetch of upstream's own branch
# and fails, naming the patch and the files, the moment one stops applying.
#
# It runs weekly because that is the cadence at which upstream moves under us,
# and on every change to the series, the tools or the ledger — so a change that
# breaks the carry set is caught by the change rather than by the calendar.
#
# It files nothing. Submission is a person's command (`submit/pr<N>-*.sh`), and
# `verify_submission_is_a_manual_step` asserts that no automation here can open a
# pull request.

on:
  push:
    branches: [dev, main]
    paths:
      - "carry/**"
      - "tools/make_fork_branches.py"
      - "tools/rebase_upstream_patches.py"
      - "tools/measure_carry_exposure.py"
      - "tools/render_carry_ledger.py"
      - "tools/record_submission.py"
      - "submit/**"
      - "verification/verify_carry_*.sh"
      - "verification/verify_pr_branches_match_patches.sh"
      - "verification/verify_accepted_patches_dropped_from_carry.sh"
      - "verification/verify_submission_is_a_manual_step.sh"
      - "CARRY-LEDGER.md"
      - ".github/workflows/carry.yml"
  pull_request:
    branches: [dev, main]
  schedule:
    # Mondays, an hour before the AVM_WASM job, so a carry-set break is already
    # reported by the time the expensive build starts failing for the same reason.
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: carry-${{ github.ref }}
  cancel-in-progress: true

# THE COMMITTER IDENTITY. See the long account at the same place in `avm-wasm.yml`; the short
# version is that the `garm-*` runners have no git identity and no domain in their hostname, so
# `git rebase` cannot commit, and `just rebase-upstream-patches` reported that as the carry set's
# own failure -- "5 patch(es): 1 blocked, 4 conflicts" on 2026-09-04, in the first run that ever
# got far enough to say anything. None of those four conflicts was real.
#
# Set at workflow level so a job added later inherits it rather than having to remember it.
env:
  GIT_AUTHOR_NAME: aztec-avm-runtime CI
  GIT_AUTHOR_EMAIL: ci@aztec-avm-runtime.invalid
  GIT_COMMITTER_NAME: aztec-avm-runtime CI
  GIT_COMMITTER_EMAIL: ci@aztec-avm-runtime.invalid

jobs:
  carry-set-still-applies:
    name: the carry set still applies to upstream HEAD
    runs-on: eph-linux-x64
    # No build: this replays patches and reads git history. Minutes, not hours.
    timeout-minutes: 45
    steps:
      # PREFLIGHT, and it is here because its absence cost this campaign nine
      # milestones of CI. `create-github-app-token` fails with a node stack
      # trace naming only the FIRST input it finds missing, which read for
      # months as a problem with `app-id` when both inputs were empty. This
      # step names both, and names the remedy.
      #
      # THE CONTROL. `secrets.GITHUB_TOKEN` is minted by the runner for every
      # job and cannot be empty. Without it, "the repository secret is empty"
      # would be indistinguishable from "the secrets context is not being
      # populated" and from "these expressions are misspelled" — three
      # explanations with three different remedies. With it green, an empty
      # `CI_TOKEN_PROVIDER_*` is a statement about this repository's
      # configuration; with it red, this step says so and refuses to blame the
      # configuration.
      - name: Assert the CI-token inputs are present
        shell: bash
        env:
          APP_ID_PRESENT: ${{ vars.CI_TOKEN_PROVIDER_APP_ID != '' }}
          PRIVATE_KEY_PRESENT: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY != '' }}
          CONTROL_PRESENT: ${{ secrets.GITHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${CONTROL_PRESENT}" != "true" ]; then
            echo "::error::CONTROL FAILED: secrets.GITHUB_TOKEN is empty, so the secrets context is not being populated at all. Nothing this step says about repository configuration is trustworthy; fix the runner or the workflow before reading the messages below."
            exit 2
          fi
          rc=0
          if [ "${APP_ID_PRESENT}" != "true" ]; then
            echo "::error::vars.CI_TOKEN_PROVIDER_APP_ID is empty. Organisation variables do not reach private repositories in this organisation (see THE CI TOKEN, DIAGNOSED at the top of this workflow); set a REPOSITORY variable: gh variable set CI_TOKEN_PROVIDER_APP_ID --repo metacraft-labs/aztec-avm-runtime --body 3115338"
            rc=1
          fi
          if [ "${PRIVATE_KEY_PRESENT}" != "true" ]; then
            echo "::error::secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY is empty. Organisation secrets do not reach private repositories in this organisation; set a REPOSITORY secret: gh secret set CI_TOKEN_PROVIDER_PRIVATE_KEY --repo metacraft-labs/aztec-avm-runtime < ci-app-private-key.pem"
            rc=1
          fi
          exit "$rc"

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # The workspace layout the checks assume: aztec-packages and
      # codetracer-specs are SIBLINGS of this repository.
      - name: Checkout aztec-avm-runtime
        uses: actions/checkout@v4
        with:
          path: aztec-avm-runtime

      - name: Clone the aztec-packages fork
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/aztec-packages
          ref: aztec-avm-runtime
          path: aztec-packages
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Clone codetracer-specs (the prepared patch series)
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-specs
          ref: latest
          path: codetracer-specs
          gh-token: ${{ steps.app-token.outputs.token }}

      # A shallow clone has neither the base commit nor the twelve months of
      # history the exposure measurement reads, and both failures read like
      # broken patches rather than like a missing clone.
      - name: Deepen the fork and add the upstream remote
        working-directory: aztec-packages
        run: |
          set -euo pipefail
          git fetch --unshallow 2>/dev/null || true
          git remote get-url upstream >/dev/null 2>&1 \
            || git remote add upstream https://github.com/AztecProtocol/aztec-packages.git
          git fetch upstream next
          git rev-parse --verify 233d8e0993^{commit}

      - name: Setup Dev Environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}

      # `shell: bash` rather than the default `bash -e {0}`, which has no
      # pipefail: piping into `tee` would otherwise hand the step tee's exit
      # status and a failing check would report a green job.
      - name: Replay the carry set onto upstream HEAD
        working-directory: aztec-avm-runtime
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: dev-exec just rebase-upstream-patches 2>&1 | tee rebase.log

      - name: The carry set, the branches, the ledger and the exposure
        working-directory: aztec-avm-runtime
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          M11_WORK: ${{ github.workspace }}/m11-work
        run: dev-exec just verify-m11 2>&1 | tee verify-m11.log

      - name: Collect the reports
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts-carry
          for f in aztec-avm-runtime/rebase.log \
                   aztec-avm-runtime/verify-m11.log \
                   aztec-avm-runtime/carry/rebase.json \
                   aztec-avm-runtime/carry/exposure.json \
                   aztec-avm-runtime/CARRY-LEDGER.md ; do
            [ -f "$f" ] && cp "$f" artifacts-carry/ || true
          done
          ls -la artifacts-carry

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-carry-reports
          path: artifacts-carry
          retention-days: 90
