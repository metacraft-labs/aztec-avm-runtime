              print(a["arm"], e.get("kind"), e.get("reason", ""),
                    "raw=" + str(e.get("rawRevertCode", "-")),
                    "typed=" + str(e.get("revertCode", "-")),
                    "bal", a["balanceBefore"], "->", a["balanceAfter"])
