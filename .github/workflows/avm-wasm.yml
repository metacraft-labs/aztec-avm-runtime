      # nothing`. That was invisible from the run page because the job also collected the wrong
      # directory and uploaded an empty artefact (branch avm-reds @ dfe87d8fa fixes the collection);
      # this fixes what it would have been collecting evidence OF.
      - name: Install diffsim's packages (verify-m13 runs first and decodes with upstream's reader)
