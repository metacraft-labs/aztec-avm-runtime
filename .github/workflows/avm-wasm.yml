    runs-on: [self-hosted, x86-64-v3, gpu]
    # M14. TWO worktrees of the pinned anchor, and the only difference between them is M14's ONE
    # patch — the archive tree on the in-memory reference world state. Deliberately NOT the
    # AVM_WASM stack: the patch changes a component the AVM does not use, so it is built against
    # pristine upstream where it is reviewable on its own terms, and both trees build upstream's own
    # `world_state_tests` and `vm2_tests` natively. The real, lmdb-backed WorldState cannot run in
    # wasm, so the comparison this milestone rests on is a native one.
    #
    # THE CACHE IS WHY THIS JOB IS AFFORDABLE. Both dev shells now put ccache on the compiler
    # launcher path, so the second tree's build is almost entirely hits. CCACHE_DIR is set to a
    # workspace path and restored between runs: a cold runner pays 327 s per `vm2_tests` and a warm
    # one paid 9 s when it was measured, build directory deleted in between.
    #
    # STATUS, STATED PLAINLY: this job has never run, and neither has any job above it. They all
    # still stop at the CI token, which is now DIAGNOSED — see THE CI TOKEN, DIAGNOSED at the
    # top of this file, and the remaining blocker is a repository-level
    # `CI_TOKEN_PROVIDER_PRIVATE_KEY` only the user can set. So this job existing means it is
    # wired and names the checks — not that a run has ever gated anything. WORLD-STATE.md says
    # the same thing in prose.
    #
    # None of M14's eight checks times anything, so a busy runner costs time here rather than a
    # wrong number.
    timeout-minutes: 180
    steps:
      # THE FIRST STEP IN THE JOB, ON PURPOSE — it prints even when the job dies at the CI token
      # or part-way through a build, which is exactly when the reading is wanted. See
      # THE x86_64 BASELINE at the top of this file for what is being measured and why.
      - name: CPU inventory — the flags -march=skylake requires, measured rather than assumed
        shell: bash
        run: |
          set -uo pipefail
          echo "runner: ${RUNNER_NAME:-unknown}   host: $(hostname)"
          echo "cpu:    $(awk -F': ' '/^model name/{print $2; exit}' /proc/cpuinfo)"
          for feat in adx bmi1 bmi2 avx avx2 fma; do
            if grep -q -w "$feat" /proc/cpuinfo; then
              echo "  cpu flag $feat: present"
            else
              echo "  cpu flag $feat: ABSENT — barretenberg's x86_64 baseline needs it and never checks for it"
            fi
          done
      # PREFLIGHT, and it is here because its absence cost this campaign nine
      # milestones of CI. `create-github-app-token` fails with a node stack
      # trace naming only the FIRST input it finds missing, which read for
      # months as a problem with `app-id` when both inputs were empty. This
      # step names both, and names the remedy.
      #
      # THE CONTROL. `secrets.GITHUB_TOKEN` is minted by the runner for every
      # job and cannot be empty. Without it, "the repository secret is empty"
      # would be indistinguishable from "the secrets context is not being
      # populated" and from "these expressions are misspelled" — three
      # explanations with three different remedies. With it green, an empty
      # `CI_TOKEN_PROVIDER_*` is a statement about this repository's
      # configuration; with it red, this step says so and refuses to blame the
      # configuration.
      - name: Assert the CI-token inputs are present
        shell: bash
        env:
          APP_ID_PRESENT: ${{ vars.CI_TOKEN_PROVIDER_APP_ID != '' }}
          PRIVATE_KEY_PRESENT: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY != '' }}
          CONTROL_PRESENT: ${{ secrets.GITHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${CONTROL_PRESENT}" != "true" ]; then
            echo "::error::CONTROL FAILED: secrets.GITHUB_TOKEN is empty, so the secrets context is not being populated at all. Nothing this step says about repository configuration is trustworthy; fix the runner or the workflow before reading the messages below."
            exit 2
          fi
          rc=0
          if [ "${APP_ID_PRESENT}" != "true" ]; then
            echo "::error::vars.CI_TOKEN_PROVIDER_APP_ID is empty. Organisation variables do not reach private repositories in this organisation (see THE CI TOKEN, DIAGNOSED at the top of this workflow); set a REPOSITORY variable: gh variable set CI_TOKEN_PROVIDER_APP_ID --repo metacraft-labs/aztec-avm-runtime --body 3115338"
            rc=1
          fi
          if [ "${PRIVATE_KEY_PRESENT}" != "true" ]; then
            echo "::error::secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY is empty. Organisation secrets do not reach private repositories in this organisation; set a REPOSITORY secret: gh secret set CI_TOKEN_PROVIDER_PRIVATE_KEY --repo metacraft-labs/aztec-avm-runtime < ci-app-private-key.pem"
            rc=1
          fi
          exit "$rc"

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout aztec-avm-runtime
        uses: actions/checkout@v4
        with:
          path: aztec-avm-runtime

      - name: Clone the aztec-packages fork
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/aztec-packages
          ref: aztec-avm-runtime
          path: aztec-packages
          gh-token: ${{ steps.app-token.outputs.token }}

      # WITHOUT THIS, `verify_block_level_gap_audit_complete` CANNOT RUN, AND b55fdcb SAID IT COULD.
      # That commit scanned for exactly this shape, flagged this job, and cleared it on the grounds
      # that "m6_prepare_tree applies only the patches passed to it, and M14 passes just its own
      # in-repo patch". That is true and it is not the whole of what M14 resolves: the gap audit
      # ENUMERATES `$M6_UPSTREAM_BUGS` — `codetracer-specs/upstream-bugs` — to price this
      # contribution's carry exposure against every other prepared patch, and names one of them
      # outright. Run 33941133790 is the record, 32 failures out of 131 assertions:
      #
      #     verify_block_level_gap_audit_complete.sh: line 236: cd:
      #       .../codetracer-specs/upstream-bugs: No such file or directory
      #     awk: fatal: cannot open file `.../codetracer-specs/upstream-bugs/
      #       aztec-avm-wasm-cmake/0001-build-wasm-optional-AVM_WASM-...patch'
      #
      # `ref: latest`, not `main`, for the reason spelled out at the M7 job: `latest` is that
      # repository's default branch and the only one the series is published on, and `main` carries
      # no `upstream-bugs/` at all.
      - name: Clone codetracer-specs (the prepared patch series)
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-specs
          ref: latest
          path: codetracer-specs
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Setup Dev Environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Assert the series base commit is present
        working-directory: aztec-packages
        run: |
          set -euo pipefail
          git fetch --unshallow 2>/dev/null || true
          git rev-parse --verify 233d8e0993^{commit}

      - name: Assert M14's own patch and its prepared contribution are present
        run: |
          set -euo pipefail
          # ONE patch, and the two documents a sixth upstream contribution needs. They live beside
          # the checks rather than in codetracer-specs/upstream-bugs/, because that directory is
          # enumerated by verify_carry_set_complete and every entry in it must equal a branch
          # PUBLISHED on the fork's origin. See WORLD-STATE.md section 6.
          #
          # THE LAST TWO ARE THE ONES THIS STEP USED TO OMIT, and the omission is what let the job
          # walk past a missing sibling checkout into a confusing failure two steps later. The rule
          # b55fdcb set for the M15 job holds here: an input is asserted if a check resolves it,
          # wherever it lives. The gap audit resolves the specs directory and names one patch inside
          # it, so both are listed.
          for p in \
            aztec-avm-runtime/verification/m14/0001-feat-world_state_reference-archive-tree-so-the-in-me.patch \
            aztec-avm-runtime/verification/m14/PR.md \
            aztec-avm-runtime/verification/m14/verify.sh \
            aztec-avm-runtime/verification/m14/world_state_block_probe.cpp \
            codetracer-specs/upstream-bugs/aztec-avm-wasm-cmake/0001-build-wasm-optional-AVM_WASM-and-separate-the-AVM-mod.patch ; do
            test -f "$p" || { echo "::error::missing M14 input: $p" >&2; exit 1; }
          done
          test -d codetracer-specs/upstream-bugs \
            || { echo "::error::missing M14 input: codetracer-specs/upstream-bugs (the gap audit enumerates it)" >&2; exit 1; }

      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          # The cache the dev shells' CCACHE_DIR points at when it is set from outside. A miss here
          # costs time and nothing else: verify_compiler_cache_effective measures cold and warm in
          # a PRIVATE cache directory of its own, so its result does not depend on this restoring.
          path: ${{ github.workspace }}/ccache
          key: avm-wasm-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            avm-wasm-ccache-${{ runner.os }}-

      - name: Build both trees and run the M14 checks
        working-directory: aztec-avm-runtime
        env:
          # Not $TMPDIR: the two trees are several gigabytes and a tmpfs /tmp is the wrong place. A
          # DIFFERENT directory from every other job's, so none of them can answer for another.
          M14_WORK: ${{ github.workspace }}/m14-work
          CCACHE_DIR: ${{ github.workspace }}/ccache
        # See the M7 job: `shell: bash` supplies `-o pipefail`, which the default `bash -e {0}` does
        # not, so `| tee` cannot swallow a failure.
        shell: bash
        run: dev-exec just verify-m14 2>&1 | tee verify-m14.log

      - name: Collect the probe transcripts and the measurement record
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts-m14
          cp aztec-avm-runtime/verify-m14.log artifacts-m14/ 2>/dev/null || true
          for f in "${{ github.workspace }}"/m14-work/probe-*.txt \
                   "${{ github.workspace }}"/m14-work/probe-*.txt.err \
                   "${{ github.workspace }}"/m14-work/measured.env \
                   "${{ github.workspace }}"/m14-work/nm.txt \
                   "${{ github.workspace }}"/m14-work/ccache-scratch/*.txt ; do
            [ -f "$f" ] && cp "$f" artifacts-m14/ || true
          done
          ls -la artifacts-m14

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avm-wasm-world-state-block-coverage
          path: artifacts-m14
          retention-days: 30

