    # from PATH and records the version it ran against rather than assuming one, which is right for
    # a developer's box and not enough for a runner whose image may have no browser at all. `nix
    # shell nixpkgs#chromium` makes the provisioning explicit and reproducible. Demonstrated
    # locally: `nix shell nixpkgs#chromium --command chromium --version` prints
    # `Chromium 151.0.7922.137`, and the gate runs green under it.
    #
