          cp "${{ github.workspace }}"/m20-work/arms.stderr artifacts-m20/ 2>/dev/null || true
          ls -la artifacts-m20

      - name: Upload the Form A artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-a-external-transactions
          path: artifacts-m20
          retention-days: 30

