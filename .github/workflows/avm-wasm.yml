          # `verify-halves-compose` is M18's ONE check that does: it points M17's and M12's work
          # directories at $M18_WORK and drives M12's machinery, leaving the module at
          # $M18_WORK/m12/barretenberg/cpp/build-wasm-avm/bin/avm.wasm. The five token/block checks
          # only LOOK — `tb_find_module` (verification/lib_token_blocks.sh:49) tries
          # $AVM_WASM_PATH, then $TB_WORK, then two hard-coded $HOME/.cache M13/M15 paths that are
          # populated by OTHER JOBS ON OTHER MACHINES and that nothing here writes.
          #
          # So in run 34160613484 the first five checks passed with 283 assertions and the last
          # five died identically at `cannot run: no built avm.wasm was found`, 0 assertions each.
          # They had never executed before: the six TypeScript errors fixed in this branch were in
          # `typecheck-orchestration`, an EARLIER step, so the job had never reached verify-m18.
          #
          # Naming the module this job already builds is the whole fix. M12's thirty-nine exports
          # (lib_m12_reactor.sh:150) include all seven of TB_REQUIRED_EXPORTS, which is why
          # lib_m22_block.sh:153 already lists this exact path as an acceptable candidate. No
          # second tree and no second build: verify-m18 re-runs verify-halves-compose, and its
          # m17_measured record short-circuits once the tree is materialised.
          dev-exec just verify-halves-compose 2>&1 | tee verify-m18-build.log | tail -5
          export AVM_WASM_PATH="${M18_WORK}/m12/barretenberg/cpp/build-wasm-avm/bin/avm.wasm"
          test -s "$AVM_WASM_PATH" || { echo "::error::no module at $AVM_WASM_PATH" >&2; exit 1; }
          dev-exec just verify-m18 2>&1 | tee verify-m18.log

      - name: Collect the round-trip transcript
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts-m18
          cp aztec-avm-runtime/verify-m18.log artifacts-m18/ 2>/dev/null || true
          for f in "${{ github.workspace }}"/m18-work/roundtrip.out \
                   "${{ github.workspace }}"/m18-work/roundtrip.err \
                   "${{ github.workspace }}"/m18-work/m17-measured.env ; do
            [ -f "$f" ] && cp "$f" artifacts-m18/ || true
          done
          ls -la artifacts-m18

      - name: Upload the orchestration artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestration
          path: artifacts-m18
          retention-days: 30

  differential-oracle:
    name: three-way differential — wasm AVM vs native C++ AVM vs TypeScript interpreter
    runs-on: [self-hosted, x86-64-v3, gpu]
    # M19. A SEPARATE FAILURE DOMAIN, and that is a requirement rather than a convenience.
    #
    # This job compares the shipped wasm AVM against an oracle that is DELIBERATELY OUT OF DATE:
    # the in-process NAPI AVM in the 5.0.0 npm line, which is anchor `ts` — sixty days and 2,012
    # commits behind upstream's tip, with 276 changed files under vm2/ in between (DRIFT.md D6,
    # D15; `just version-gap` prints the numbers on every run of this job). An oracle like that
    # will eventually disagree for reasons that are facts about the oracle, and when it does, the
    # browser bundle, the unit suites, the app tests and the world-state fidelity suites must not
    # go red with it.
    #
    # `needs:` is therefore EMPTY on purpose, and no other job in this workflow names this one.
    # `verify_differential_job_separate_failure_domain` asserts both directions against the parsed
    # YAML rather than against a comment, because a job named in a comment is not a job.
    #
    # CONTAINMENT. Nothing this job installs reaches the published package. `@aztec/native` is a
    # dependency of `diffsim/` alone; `orchestration/`, which is what ships, has four dependencies
    # and none of them is native. `verify_differential_containment` asserts that against `npm pack`
    # output and against the shipped import graph, not against this comment.
    #
    # STATUS, STATED PLAINLY: this job has never run, and neither has any job above it. They all
    # still stop at the CI token, DIAGNOSED — see THE CI TOKEN, DIAGNOSED at the top of this
    # file, and the remaining blocker is a repository-level `CI_TOKEN_PROVIDER_PRIVATE_KEY` only
    # the user can set.
    timeout-minutes: 180
    steps:
      # THE FIRST STEP IN THE JOB, ON PURPOSE — it prints even when the job dies at the CI token
      # or part-way through a build, which is exactly when the reading is wanted. See
      # THE x86_64 BASELINE at the top of this file for what is being measured and why.
      - name: CPU inventory — the flags -march=skylake requires, measured rather than assumed
        shell: bash
        run: |
          set -uo pipefail
          echo "runner: ${RUNNER_NAME:-unknown}   host: $(hostname)"
          echo "cpu:    $(awk -F': ' '/^model name/{print $2; exit}' /proc/cpuinfo)"
          for feat in adx bmi1 bmi2 avx avx2 fma; do
            if grep -q -w "$feat" /proc/cpuinfo; then
              echo "  cpu flag $feat: present"
            else
              echo "  cpu flag $feat: ABSENT — barretenberg's x86_64 baseline needs it and never checks for it"
            fi
          done
      # PREFLIGHT, and it is here because its absence cost this campaign nine
      # milestones of CI. `create-github-app-token` fails with a node stack
      # trace naming only the FIRST input it finds missing, which read for
      # months as a problem with `app-id` when both inputs were empty. This
      # step names both, and names the remedy.
      #
      # THE CONTROL. `secrets.GITHUB_TOKEN` is minted by the runner for every
      # job and cannot be empty. Without it, "the repository secret is empty"
      # would be indistinguishable from "the secrets context is not being
      # populated" and from "these expressions are misspelled" — three
      # explanations with three different remedies. With it green, an empty
      # `CI_TOKEN_PROVIDER_*` is a statement about this repository's
      # configuration; with it red, this step says so and refuses to blame the
      # configuration.
      - name: Assert the CI-token inputs are present
        shell: bash
        env:
          APP_ID_PRESENT: ${{ vars.CI_TOKEN_PROVIDER_APP_ID != '' }}
          PRIVATE_KEY_PRESENT: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY != '' }}
          CONTROL_PRESENT: ${{ secrets.GITHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${CONTROL_PRESENT}" != "true" ]; then
            echo "::error::CONTROL FAILED: secrets.GITHUB_TOKEN is empty, so the secrets context is not being populated at all. Nothing this step says about repository configuration is trustworthy; fix the runner or the workflow before reading the messages below."
            exit 2
          fi
          rc=0
          if [ "${APP_ID_PRESENT}" != "true" ]; then
            echo "::error::vars.CI_TOKEN_PROVIDER_APP_ID is empty. Organisation variables do not reach private repositories in this organisation (see THE CI TOKEN, DIAGNOSED at the top of this workflow); set a REPOSITORY variable: gh variable set CI_TOKEN_PROVIDER_APP_ID --repo metacraft-labs/aztec-avm-runtime --body 3115338"
            rc=1
          fi
          if [ "${PRIVATE_KEY_PRESENT}" != "true" ]; then
            echo "::error::secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY is empty. Organisation secrets do not reach private repositories in this organisation; set a REPOSITORY secret: gh secret set CI_TOKEN_PROVIDER_PRIVATE_KEY --repo metacraft-labs/aztec-avm-runtime < ci-app-private-key.pem"
            rc=1
          fi
          exit "$rc"

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout aztec-avm-runtime
        uses: actions/checkout@v4
        with:
          path: aztec-avm-runtime

      - name: Clone the aztec-packages fork
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/aztec-packages
          ref: aztec-avm-runtime
          path: aztec-packages
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Clone codetracer-specs (the prepared patch series)
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-specs
          ref: latest
          path: codetracer-specs
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Setup Dev Environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}

      # WITHOUT THIS, `just version-gap` CANNOT RESOLVE ITS OWN TIP, AND THAT IS THE WHOLE OF DD-12's RED.
      # `tools/version_gap.py:85` does `git rev-parse upstream/next` in the fork. The clone above adds
      # only `origin` (metacraft-labs/aztec-packages); `upstream` is AztecProtocol's repository and
      # nothing in this workflow ever added it. So run 33941133790 died before it computed anything:
      #
      #     version_gap: git rev-parse upstream/next failed: fatal: ambiguous argument 'upstream/next'
      #     error: recipe `version-gap` failed on line 685 with exit code 1
      #
      # Note what is absent from that log: no gap, no threshold line, no header. Exit 1 is the generic
      # git-plumbing death, NOT the tool's own exit 3 ("over threshold") or exit 2 ("the fork cannot
      # answer") — so a missing remote was indistinguishable at the exit code from a real drift.
      # It read as a version-gap failure and it never measured a version gap.
      #
      # This is why it was invisible locally: a developer workspace's aztec-packages has BOTH remotes,
      # so the identical command succeeds there. The measured gap is 67 days against a 180-day
      # threshold — the check passes on this content once it can run at all.
      #
      # `carry.yml` already carries exactly this step for exactly this need; this is that step.
      # `verify_oracle_version_gap_reported.sh:45` repeats the same bare rev-parse, so `just
      # verify-m19` would have died the same way at the next step had it been reached.
      - name: Deepen the fork and add the upstream remote (version_gap.py resolves upstream/next)
        working-directory: aztec-packages
        shell: bash
        run: |
          git fetch --unshallow 2>/dev/null || true
          git remote get-url upstream >/dev/null 2>&1 \
            || git remote add upstream https://github.com/AztecProtocol/aztec-packages.git
          git fetch upstream next
          git rev-parse --verify upstream/next

      - name: Install diffsim's packages (this is where the NAPI oracle lives)
        working-directory: aztec-avm-runtime/diffsim
        shell: bash
        run: dev-exec npm ci 2>&1 | tail -20

      # `verify_differential_containment` walks the SHIPPED import graph, and
      # `orchestration/node_modules` is what it walks. Without it the check refuses —
      # "cannot run: the orchestration's packages are not installed and the import graph cannot be
      # walked" — and `die` prints no FAIL line and no assertion summary, so in run 34160613484 it
      # vanished from the sweep rather than reading as red. The form-a job already carries this
      # step; this job was written without it.
      - name: Install the orchestration's published @aztec packages
        working-directory: aztec-avm-runtime/orchestration
        shell: bash
        run: dev-exec npm ci 2>&1 | tail -20

      - name: THE VERSION GAP (DD-12)
        working-directory: aztec-avm-runtime
        shell: bash
        # Printed BEFORE the comparison, every run, and it fails the job when the gap crosses the
        # recorded threshold. A green differential against an oracle nobody has looked at in a year
        # is the worst kind of decay available, and this is the thing that makes the decay visible.
        run: dev-exec just version-gap

      - name: Build avm.wasm and run the three-way differential
        working-directory: aztec-avm-runtime
        env:
          # Not $TMPDIR: the build is several gigabytes and a tmpfs /tmp is the wrong place.
          M12_WORK: ${{ github.workspace }}/m12-work
          M19_WORK: ${{ github.workspace }}/m19-work
        shell: bash
        run: |
          set -euo pipefail
          # THIS STEP'S NAME HAS ALWAYS SAID "Build avm.wasm"; NOTHING IN IT EVER DID.
          # `just verify-m19` does not build — `m19_find_module`
          # (verification/lib_m19_differential.sh:43) only LOOKS: at $AVM_WASM_PATH, at $M19_WORK,
          # and at three hard-coded ~/.cache trees belonging to OTHER MILESTONES, which in this
          # workflow are other jobs on other machines. The job-start hook wipes the workspace, so
          # on a runner none of the four candidates can exist.
          #
          # Run 34160613484 therefore refused four of seven checks with "cannot run: no built
          # avm.wasm was found" and exited 1 in ELEVEN SECONDS having compared nothing — and `die`
          # prints neither a FAIL line nor an assertion summary, so the job went red with no
          # failing assertion anywhere in its log. The two checks that need no module passed.
          #
          # This is not the same defect as the `upstream` remote, which cf5afd8 fixed and which is
          # verified green here: the fetch step above succeeds and verify_oracle_version_gap_reported
          # passes on the fork's actual tip. This is the cause that was behind it.
          #
          # verify_avm_wasm_import_surface is M12's check that BUILDS, and M12's module carries all
          # fifteen exports lib_m19_differential.sh requires (its own list is thirty-nine).
          dev-exec just verify-reactor-imports 2>&1 | tee verify-reactor-imports.log | tail -20
          export AVM_WASM_PATH="${M12_WORK}/m12/barretenberg/cpp/build-wasm-avm/bin/avm.wasm"
          test -s "$AVM_WASM_PATH" || { echo "::error::no module at $AVM_WASM_PATH" >&2; exit 1; }
          dev-exec just verify-m19 2>&1 | tee verify-m19.log

      - name: THE HEADLINE — differential comparisons, not tests
        if: always()
        working-directory: aztec-avm-runtime
        shell: bash
        # The deliverable, literally: the number CI reports is the COMPARISON count. It is printed
        # in its own step so it is the line a reader finds first, and it exits non-zero when the
        # surface falls below the recorded floor.
        run: dev-exec just report-comparisons

      - name: Collect the differential artefacts
        if: always()
        # `shell: bash` and not the default. GitHub's default is `bash -e {0}`, under which a
        # pipeline reports the LAST command's status — so a step that pipes can report success
        # after its real work failed. Every piping step in this job declares it, and
        # `verify_differential_job_separate_failure_domain` asserts that against the parsed YAML.
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts-m19
          cp aztec-avm-runtime/verify-m19.log artifacts-m19/ 2>/dev/null || true
          cp aztec-avm-runtime/fixtures/three-way-arm-counts.json artifacts-m19/ 2>/dev/null || true
          cp aztec-avm-runtime/fixtures/differential-wasm-divergences.json artifacts-m19/ 2>/dev/null || true
          for f in "${{ github.workspace }}"/m19-work/clean.log \
                   "${{ github.workspace }}"/m19-work/counted.log ; do
            [ -f "$f" ] && cp "$f" artifacts-m19/ || true
          done
          ls -la artifacts-m19

      - name: Upload the differential artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-oracle
          path: artifacts-m19
          retention-days: 30

