name: AVM_WASM

# Nothing in either repository builds `AVM_WASM=ON` on a schedule, so it rots the
# moment upstream moves. This job is M6's recorded risk and M7's answer to it: it
# builds the AVM and its in-memory world state for `wasm32-wasip1` from the
# prepared patch series and then RUNS upstream's own vm2 simulation suite against
# the result, on both runtimes, comparing native and wasm per test.
#
# It runs on every change to anything that can move the AVM_WASM build: the
# verification harness, the M7 overlay, the prepared patches carried in
# codetracer-specs (which the job checks out), the flakes and the pins.
#
# There is no green path that skips: every step below either does its work or
# fails the job. `just verify-m7` runs all six checks even if an earlier one
# fails, and exits non-zero if any did, so one run reports everything that broke.

# THE CI TOKEN, DIAGNOSED — 2026-08-25
#
# Every job in this file and in `carry.yml` has aborted at `Generate CI token`
# on `Input required and not supplied: app-id` since the workflows were written.
# M11 recorded it as undiagnosed; M20 measured it. The account below is the
# measurement, so that the next reader does not re-run the refuted hypotheses.
#
# WHAT THE ERROR HID. The action names only the FIRST required input it finds
# missing. The `with:` echo one line above the stack trace is the datum, and it
# read:
#
#     ##[group]Run actions/create-github-app-token@v1
#     with:
#       owner: metacraft-labs
#       github-api-url: https://api.github.com
#
# `private-key` is absent there TOO. So it was never "one variable spelled
# wrong": nothing organisation-level was arriving at all.
#
# WHAT THE RUNNER SAID. A probe on branch `ci/token-probe` printed the contexts
# themselves (run 32841097268): `toJSON(vars)` was `{}` and `toJSON(secrets)`
# was `{"github_token": "***"}`, with `secrets.GITHUB_TOKEN != ''` as the
# control, green. A green control is what makes that a fact about the
# organisation-to-repository grant rather than about the probe.
#
# WHY THE OBVIOUS COMPARISON MISLED. `metacraft-labs/codetracer-ci` is private,
# in the same organisation, on the same runner group and label, using the same
# `@v1` action and the same `vars.` spelling — and its token step succeeds. That
# looked like a refutation of every organisation-level explanation. It is not,
# because `codetracer-ci` does not read the organisation variable: it has a
# REPOSITORY variable of the same name, and a repository secret for the key.
# So does `codetracer-native-recorder`; `codetracer-launcher` carries repository
# secrets for both. Every private repository in this organisation that mints a
# token carries its own copies. `aztec-avm-runtime`, created 2026-08-21, is the
# one that never got them.
#
# WHY THE REST API DID NOT CATCH IT. `GET /repos/{owner}/{repo}/actions/
# organization-variables` lists `CI_TOKEN_PROVIDER_APP_ID` for this repository,
# and `organization-secrets` lists both organisation secrets. Those endpoints
# report what the organisation DECLARED (`visibility: all`) and not what the
# runner DELIVERS. Read as "what this repository will get", they are a question
# asked of a tree that cannot answer it the other way. `toJSON(vars)` on the
# runner is the tree that can.
#
# THE RULE THAT FITS EVERY OBSERVATION. `metacraft-labs` is on the `free` plan,
# where organisation variables and secrets reach PUBLIC repositories only. Every
# private repository here works around it with repository-level copies.
#
# PROVED BOTH WAYS. A repository variable `CI_TOKEN_PROVIDER_APP_ID = 3115338`
# was then set on this repository and the identical probe re-run at the same
# commit (run 32841465463): `toJSON(vars)` became non-empty, the action echoed
# `app-id: 3115338`, `toJSON(secrets)` was unchanged, and the error moved to
# `Input required and not supplied: private-key`. One variable changed; the
# failure moved exactly one input along.
#
# WHAT IS STILL MISSING, AND WHO CAN SUPPLY IT. A REPOSITORY secret
# `CI_TOKEN_PROVIDER_PRIVATE_KEY` holding the CI app's private key. Secret
# plaintext is not readable through the API by anyone, organisation owners
# included, so this is the user's step and no agent can take it:
#
#     gh secret set CI_TOKEN_PROVIDER_PRIVATE_KEY \
#       --repo metacraft-labs/aztec-avm-runtime < ci-app-private-key.pem
#
# Until then every job still stops at the token, one input later than before.
# The `Assert the CI-token inputs are present` step in front of each
# `Generate CI token` says so in those words rather than as a node stack trace.
#
# NOT THE FIX: `.github/sibling-repos`. M7 and M8 recorded its absence as a
# deterministic failure. It is not one, and adding it would BREAK these jobs:
# `clone-siblings` resolves each sibling's revision from a workspace lock in
# `metacraft-labs/metacraft-manifests` keyed by the host commit, that repository
# declares no `aztec-avm-runtime` project and holds no lock for any commit of
# it, and the action fails loudly on a commit with no lock rather than falling
# back to a branch tip. These jobs clone their two siblings explicitly with
# `clone-repo` at refs they name, which is why `clone-siblings` prints
# "no cross-repo siblings to clone" and succeeds today.

# THE x86_64 BASELINE, AND WHY MOST OF THIS FILE NO LONGER RUNS ON `eph-linux-x64` — 2026-09-07
#
# `barretenberg/cpp/cmake/arch.cmake` in the fork reads, in full:
#
#     if(CMAKE_SYSTEM_PROCESSOR MATCHES "x86_64")
#         add_compile_options(-march=skylake)
#     endif()
#
# unconditional, with upstream's own comment "Target skylake on x86 for AVX2 etc." There is no
# CPU detection and no runtime dispatch behind it. So EVERY x86_64 barretenberg binary requires
# a Skylake-class CPU: the ones these jobs compile for themselves, and equally the prebuilt
# `@aztec/bb.js` amd64-linux `nodejs_module.node`, which disassembles to 54,093 ADX and BMI2
# instructions (`adcx`, `adox`, `mulx`) plus AVX/AVX2 throughout, with ZERO `cpuid` instructions
# and ZERO IFUNC relocations.
#
# WHAT THAT LOOKS LIKE IN A LOG, AND WHY IT WAS MISREAD FOR SO LONG. The process is not failing,
# it is being KILLED: exit 132 is 128+4, SIGILL. And it prints NOTHING on stdout or stderr,
# because the addon is `dlopen`'d during the import chain before the probe's first
# `console.log`. A check that asserts on what the probe printed then reports something like
# `expected [1], got [132]` against an assertion about a TypeError, which names neither the
# signal nor the cause.
#
# THE CONTROL, from run 34052439806 on PR #3, is what makes this a reading rather than a
# hypothesis. `native-versus-wasm differential` got all the way through:
#
#     ok   the native configure exits 0  [0]
#     ok   the native build exits 0  [0]
#     bash: 10496 Illegal instruction   timeout ... "$bin"
#     FAIL the native driver exits 0  expected [0], got [132]
#     ok   the wasm driver exits 0 on V8, running the SHIPPED binary unmodified  [0]
#
# A binary the runner compiled with its own compiler moments earlier is killed by SIGILL on that
# same runner, while the SAME program built for wasm32 — where `-march` does not apply — exits 0.
# Same logic, same inputs, two ISA baselines, and only the x86 one dies. Measured again in the
# same run in `block-level world-state coverage` (eight checks, all 132) and in `the Node host`.
#
# WHAT FIXES IT, AND WHAT DOES NOT. No edit in this repository fixes it: the npm addon is shipped
# prebuilt, so even overriding `-march` for our own builds would leave the bb.js-loading jobs
# dead. What fixes it is a runner whose CPU has AVX2/BMI2/ADX. `runs-on:
# [self-hosted, x86-64-v3, gpu]` selects the persistent systemd runners on gpu-server-001 and
# gpu-server-002 (four `mcl` runners each, eight in total, all online and idle at the time of
# writing). `x86-64-v3` is the AVX2/BMI1/BMI2/FMA level and is the flag that matters; `gpu` is
# carried as well so that the selector stays pinned to these two hosts if `x86-64-v3` is ever
# added to a machine that is not one of them.
#
# THE ONE THING THE LABEL DOES NOT GUARANTEE. ADX is formally a Broadwell addition and is NOT
# part of the x86-64-v3 baseline, while `-march=skylake` wants it. In practice any CPU new enough
# to host an RTX 3090 has it — but "in practice" is not a measurement, so every moved job's FIRST
# step is a CPU inventory that prints the model name and the adx/bmi1/bmi2/avx/avx2/fma flags. It
# runs before the CI-token assert so it prints even when the job dies immediately afterwards, and
# it is what settles this by measurement rather than by inference.
#
# WHAT WAS NOT MOVED, AND WHY IT IS NOT AN OVERSIGHT. `noir-call-frames` runs node against node
# builtins and this repository's own TypeScript only. `browser-gate` builds barretenberg for
# wasm32 and drives Chromium, and its whole deliverable is asserting the ABSENCE of native
# dependencies. Neither touches an x86_64 barretenberg artefact, both are green where they are,
# and moving them would spend capacity on two hosts to buy nothing.
#
# AND THE TIMEOUTS WENT UP WITH THE MOVE, DELIBERATELY. `vm2 suite` hit the 120-minute JOB
# timeout mid-build on a cold ccache in run 34052439806 — GitHub reports that as `cancelled`,
# which reads as an operator action and is not one. These are different hosts with a different
# ccache, so the first run here is cold too. The building jobs are budgeted 180 minutes;
# `fallback-triggers` builds nothing and stays at 30.

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  # Upstream moves under us; a weekly run is what turns "it rotted" from a
  # surprise at the next milestone into a dated failure.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: avm-wasm-${{ github.ref }}
  cancel-in-progress: true

# THE COMMITTER IDENTITY, WITHOUT WHICH `git am` AND `git rebase` REFUSE TO COMMIT.
#
# The first run that ever reached a check (2026-09-04, after `just` was added to the dev shell)
# failed in eleven of thirteen jobs for one reason, and it was not any of theirs:
#
#     Committer identity unknown
#     *** Please tell me who you are.
#     fatal: unable to auto-detect email address (got 'runner@garm-r4vldvaibcyp.(none)')
#
# The ephemeral `garm-*` runners have no git identity and their hostname has no domain, so git
# cannot invent one. Nothing in either workflow set one. Every job that applies the prepared patch
# series -- eleven of the thirteen here, and the carry job in `carry.yml` -- therefore could not
# commit, and reported that as the SUBJECT's failure: M8 as "git am ... failed on the avm8 tree"
# and 28 assertion failures, the carry set as "1 blocked, 4 conflicts". Those conflicts were not
# real. A red that is really this one wearing a costume cannot be triaged, so this is set before
# anything else is read.
#
# SET HERE, ONCE, RATHER THAN PER JOB. Workflow-level `env:` is inherited by every job and every
# step, including the ones inside `dev-exec`, so a job added later cannot forget it -- which is the
# failure mode a per-job `git config --global` step would have kept open. The environment variables
# are used rather than `git config` because they need no step, no shell, and no working directory,
# and because they override config rather than depending on where HOME points on a given runner.
#
# The AUTHOR pair matters as well as the COMMITTER pair: `git am` takes the author from the patch,
# but `git rebase` and any `git commit` here would otherwise need one too.
#
# IT IS DELIBERATELY NOT A PERSON. These commits are made by CI, inside a throwaway tree, and are
# never pushed anywhere; attributing them to a human would put a name on work no human did.
env:
  GIT_AUTHOR_NAME: aztec-avm-runtime CI
  GIT_AUTHOR_EMAIL: ci@aztec-avm-runtime.invalid
  GIT_COMMITTER_NAME: aztec-avm-runtime CI
  GIT_COMMITTER_EMAIL: ci@aztec-avm-runtime.invalid

jobs:
  vm2-suite-under-wasm:
    name: vm2 suite under wasm32-wasip1
    runs-on: [self-hosted, x86-64-v3, gpu]
    # A cold run is ~35 min (two full barretenberg configures, the native
    # proving-stack build behind upstream's own vm2_tests, three wasm builds and
    # two deliberate build failures). The cap is generous rather than tight so a
    # slow runner reports a real failure instead of a timeout.
    timeout-minutes: 180
    steps:
      # THE FIRST STEP IN THE JOB, ON PURPOSE — it prints even when the job dies at the CI token
      # or part-way through a build, which is exactly when the reading is wanted. See
      # THE x86_64 BASELINE at the top of this file for what is being measured and why.
      - name: CPU inventory — the flags -march=skylake requires, measured rather than assumed
        shell: bash
        run: |
          set -uo pipefail
          echo "runner: ${RUNNER_NAME:-unknown}   host: $(hostname)"
          echo "cpu:    $(awk -F': ' '/^model name/{print $2; exit}' /proc/cpuinfo)"
          for feat in adx bmi1 bmi2 avx avx2 fma; do
            if grep -q -w "$feat" /proc/cpuinfo; then
              echo "  cpu flag $feat: present"
            else
              echo "  cpu flag $feat: ABSENT — barretenberg's x86_64 baseline needs it and never checks for it"
            fi
          done
      # PREFLIGHT, and it is here because its absence cost this campaign nine
      # milestones of CI. `create-github-app-token` fails with a node stack
      # trace naming only the FIRST input it finds missing, which read for
      # months as a problem with `app-id` when both inputs were empty. This
      # step names both, and names the remedy.
      #
      # THE CONTROL. `secrets.GITHUB_TOKEN` is minted by the runner for every
      # job and cannot be empty. Without it, "the repository secret is empty"
      # would be indistinguishable from "the secrets context is not being
      # populated" and from "these expressions are misspelled" — three
      # explanations with three different remedies. With it green, an empty
      # `CI_TOKEN_PROVIDER_*` is a statement about this repository's
      # configuration; with it red, this step says so and refuses to blame the
      # configuration.
      - name: Assert the CI-token inputs are present
        shell: bash
        env:
          APP_ID_PRESENT: ${{ vars.CI_TOKEN_PROVIDER_APP_ID != '' }}
          PRIVATE_KEY_PRESENT: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY != '' }}
          CONTROL_PRESENT: ${{ secrets.GITHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${CONTROL_PRESENT}" != "true" ]; then
            echo "::error::CONTROL FAILED: secrets.GITHUB_TOKEN is empty, so the secrets context is not being populated at all. Nothing this step says about repository configuration is trustworthy; fix the runner or the workflow before reading the messages below."
            exit 2
          fi
          rc=0
          if [ "${APP_ID_PRESENT}" != "true" ]; then
            echo "::error::vars.CI_TOKEN_PROVIDER_APP_ID is empty. Organisation variables do not reach private repositories in this organisation (see THE CI TOKEN, DIAGNOSED at the top of this workflow); set a REPOSITORY variable: gh variable set CI_TOKEN_PROVIDER_APP_ID --repo metacraft-labs/aztec-avm-runtime --body 3115338"
            rc=1
          fi
          if [ "${PRIVATE_KEY_PRESENT}" != "true" ]; then
            echo "::error::secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY is empty. Organisation secrets do not reach private repositories in this organisation; set a REPOSITORY secret: gh secret set CI_TOKEN_PROVIDER_PRIVATE_KEY --repo metacraft-labs/aztec-avm-runtime < ci-app-private-key.pem"
            rc=1
          fi
          exit "$rc"

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # The harness assumes the workspace layout: aztec-packages and
      # codetracer-specs are SIBLINGS of aztec-avm-runtime (verification/lib.sh
      # resolves FORK_ROOT that way and fails if it is not there). Reproduce it
      # inside the runner's workspace rather than teaching the checks a second
      # layout.
      - name: Checkout aztec-avm-runtime
        uses: actions/checkout@v4
        with:
          path: aztec-avm-runtime

      - name: Clone the aztec-packages fork
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/aztec-packages
          ref: aztec-avm-runtime
          path: aztec-packages
          gh-token: ${{ steps.app-token.outputs.token }}

      # The four prepared patches and M7's overlay reference is here; the checks
      # apply them with `git am` and refuse to run without them.
      #
      # `latest`, not `main`: that repository is a specification repository, so
      # `latest` is its GitHub default branch and the only one the series is
      # published on. `main` is 292 commits behind it and carries no
      # `upstream-bugs/` at all, which made this step fail deterministically.
      - name: Clone codetracer-specs (the prepared patch series)
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-specs
          ref: latest
          path: codetracer-specs
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Setup Dev Environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}

      # The base commit the whole series applies to. A shallow clone does not
      # have it, and `git am` onto a missing base is the failure mode that reads
      # like a broken patch.
      - name: Assert the series base commit is present
        working-directory: aztec-packages
        run: |
          set -euo pipefail
          git fetch --unshallow 2>/dev/null || true
          git rev-parse --verify 233d8e0993^{commit}

      - name: Assert the prepared patches are present
        run: |
          set -euo pipefail
          for p in \
            codetracer-specs/upstream-bugs/aztec-merkle-tree-lmdb-split/0001-refactor-crypto-split-crypto_merkle_tree-from-its-LMD.patch \
            codetracer-specs/upstream-bugs/aztec-wasi-sdk-33/0001-build-move-the-wasm-toolchain-from-wasi-sdk-27-to-33.patch \
            codetracer-specs/upstream-bugs/aztec-bytecode-size-shift-32bit/0001-fix-vm2-widen-before-shifting-in-compute_public_bytec.patch \
            codetracer-specs/upstream-bugs/aztec-avm-wasm-cmake/0001-build-wasm-optional-AVM_WASM-and-separate-the-AVM-mod.patch \
            aztec-avm-runtime/verification/m7/0001-test-vm2-AVM_SIM_TESTS-the-simulation-side-test-suit.patch ; do
            test -f "$p" || { echo "::error::missing prepared patch: $p" >&2; exit 1; }
          done

      - name: Build AVM_WASM and run upstream's vm2 suite
        working-directory: aztec-avm-runtime
        env:
          # Not $TMPDIR: the builds are several gigabytes and a tmpfs /tmp is the
          # wrong place for them.
          M7_WORK: ${{ github.workspace }}/m7-work
        # `shell: bash` rather than the default, which is `bash -e {0}` WITHOUT
        # pipefail: piping into `tee` would otherwise hand the step `tee`'s exit
        # status and a failing `just verify-m7` would report a green job. Found
        # by M8's review; neither job has run, so it has never produced a false
        # green, but it would have on the first push.
        shell: bash
        run: dev-exec just verify-m7 2>&1 | tee verify-m7.log

      # The transcripts are the evidence, and a failure is exactly when they are
      # wanted; `if: always()`.
      - name: Collect transcripts
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts
          cp aztec-avm-runtime/verify-m7.log artifacts/ 2>/dev/null || true
          for f in "${{ github.workspace }}"/m7-work/*.log \
                   "${{ github.workspace }}"/m7-work/*.txt \
                   "${{ github.workspace }}"/m7-work/*.list \
                   "${{ github.workspace }}"/m7-work/*.run \
                   "${{ github.workspace }}"/m7-work/measured.env ; do
            [ -f "$f" ] && cp "$f" artifacts/ || true
          done
          ls -la artifacts

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avm-wasm-vm2-suite-transcripts
          path: artifacts
          retention-days: 30

  native-vs-wasm-differential:
    name: native-versus-wasm differential, including tree roots
    runs-on: [self-hosted, x86-64-v3, gpu]
    # M8. Two builds of ONE differential driver -- x86-64 and wasm32-wasip1 from the same
    # translation unit -- plus upstream's own `world_state_tests`, which carries the seven
    # `MemoryMerkleDBEquivalenceTest` cases that are the standing reference-versus-real fidelity
    # gate. Measured cold on 32 cores from an empty $M8_WORK: 4 min 42 s and 792 MB.
    #
    # STATUS: M11 published the series and pushed this branch, so this job and the one above run
    # for the first time. Of M7's three recorded pre-run failures, one is fixed and two are
    # assessed rather than guessed at:
    #
    #   * `ref: main` on the `codetracer-specs` checkout — FIXED. `latest` is that repository's
    #     default branch and now carries `upstream-bugs/`; that was the publication decision M7
    #     declined to guess at, and M11 made it.
    #   * no `.github/sibling-repos` in this repository — assessed as NOT a failure. Both jobs
    #     clone their two siblings explicitly with `clone-repo`, and `clone-siblings` (which
    #     `setup-dev-env` delegates to) prints "no cross-repo siblings to clone" and succeeds
    #     when neither the `siblings` input nor the file is present.
    #   * `setup-dev-env` has no `working-directory` input — assessed as NOT a failure for the
    #     `nix` flavor. That action only *installs* the `dev-exec` wrapper; the wrapper resolves
    #     the flake in the cwd of the step that calls it, and every `dev-exec` step below sets
    #     `working-directory: aztec-avm-runtime`, which is where `flake.nix` is.
    #
    # A FOURTH failure, which nobody had recorded, showed up on the first real run: `app-id`
    # read `secrets.CI_TOKEN_PROVIDER_APP_ID` where the organisation holds a VARIABLE of that
    # name. The spelling was changed to `vars.CI_TOKEN_PROVIDER_APP_ID` and it did not help,
    # because — as the FIFTH below records — neither spelling resolves here. Note that the claim
    # written beside that change, that `vars.` is "what every other repository in the
    # organisation uses", is FALSE: `codetracer-launcher` spells both inputs `secrets.`, and
    # `codetracer-ci` reads a REPOSITORY variable rather than the organisation one. The
    # organisation runs both conventions and neither reaches this repository from the
    # organisation level.
    #
    # A FIFTH, and it is the one still blocking, though it is no longer undiagnosed: this
    # repository receives NO organisation variable and NO organisation secret. Runners do pick
    # every job up (group `nixos self-hosted`) and `Set up job` succeeds; the token step then
    # finds both of its inputs empty. The full measurement, its control, and the one step the
    # user must take are under THE CI TOKEN, DIAGNOSED at the top of this file. `visibility:
    # all` on the organisation variable is a declaration, not a delivery, and reading it as one
    # is what kept this open.
    #
    # Whoever watches the first run should still expect to learn something: no assessment above
    # is a substitute for a green run, and this job — like every job in this file — still **has
    # never run** to completion. Nothing downstream of `Generate CI token` has ever executed, so
    # no check in this repository has ever been exercised in the environment it is declared for.
    timeout-minutes: 180
    steps:
      # THE FIRST STEP IN THE JOB, ON PURPOSE — it prints even when the job dies at the CI token
      # or part-way through a build, which is exactly when the reading is wanted. See
      # THE x86_64 BASELINE at the top of this file for what is being measured and why.
      - name: CPU inventory — the flags -march=skylake requires, measured rather than assumed
        shell: bash
        run: |
          set -uo pipefail
          echo "runner: ${RUNNER_NAME:-unknown}   host: $(hostname)"
          echo "cpu:    $(awk -F': ' '/^model name/{print $2; exit}' /proc/cpuinfo)"
          for feat in adx bmi1 bmi2 avx avx2 fma; do
            if grep -q -w "$feat" /proc/cpuinfo; then
              echo "  cpu flag $feat: present"
            else
              echo "  cpu flag $feat: ABSENT — barretenberg's x86_64 baseline needs it and never checks for it"
            fi
          done
      # PREFLIGHT, and it is here because its absence cost this campaign nine
      # milestones of CI. `create-github-app-token` fails with a node stack
      # trace naming only the FIRST input it finds missing, which read for
      # months as a problem with `app-id` when both inputs were empty. This
      # step names both, and names the remedy.
      #
      # THE CONTROL. `secrets.GITHUB_TOKEN` is minted by the runner for every
      # job and cannot be empty. Without it, "the repository secret is empty"
      # would be indistinguishable from "the secrets context is not being
      # populated" and from "these expressions are misspelled" — three
      # explanations with three different remedies. With it green, an empty
      # `CI_TOKEN_PROVIDER_*` is a statement about this repository's
      # configuration; with it red, this step says so and refuses to blame the
      # configuration.
      - name: Assert the CI-token inputs are present
        shell: bash
        env:
          APP_ID_PRESENT: ${{ vars.CI_TOKEN_PROVIDER_APP_ID != '' }}
          PRIVATE_KEY_PRESENT: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY != '' }}
          CONTROL_PRESENT: ${{ secrets.GITHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${CONTROL_PRESENT}" != "true" ]; then
            echo "::error::CONTROL FAILED: secrets.GITHUB_TOKEN is empty, so the secrets context is not being populated at all. Nothing this step says about repository configuration is trustworthy; fix the runner or the workflow before reading the messages below."
            exit 2
          fi
          rc=0
