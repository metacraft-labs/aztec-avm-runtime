            aztec-avm-runtime/orchestration/package-lock.json \
            aztec-avm-runtime/orchestration/tsconfig.json \
            aztec-avm-runtime/orchestration/src/index.ts \
            aztec-avm-runtime/orchestration/src/fork_checkpoint.ts \
            aztec-avm-runtime/orchestration/src/telemetry.ts \
            aztec-avm-runtime/orchestration/src/simulator_selection.ts \
            aztec-avm-runtime/orchestration/src/wasm_avm_public_tx_simulator.ts \
            aztec-avm-runtime/orchestration/src/avm_inputs.ts \
            aztec-avm-runtime/orchestration/src/roundtrip_cli.ts \
            aztec-avm-runtime/tools/import_graph.mjs \
            aztec-avm-runtime/verification/lib_m18_orchestration.sh \
            aztec-avm-runtime/verification/_fork_checkpoint_residual.py ; do
            test -f "$p" || { echo "::error::missing M18 input: $p" >&2; exit 1; }
          done

      - name: Install the orchestration's own packages
        working-directory: aztec-avm-runtime/orchestration
        shell: bash
        run: dev-exec npm ci 2>&1 | tail -20

      - name: Install the published @aztec packages the reuse enumeration reads
        working-directory: aztec-avm-runtime/diffsim
        shell: bash
        run: dev-exec npm ci 2>&1 | tail -20

      - name: Type-check the orchestration package
        working-directory: aztec-avm-runtime
        shell: bash
        run: dev-exec just typecheck-orchestration

      - name: Build avm.wasm and run the orchestration checks
        working-directory: aztec-avm-runtime
        env:
          # Not $TMPDIR. Its own directory, not M12's or M17's, so no two jobs rebuild the tree
          # under each other.
          M18_WORK: ${{ github.workspace }}/m18-work
        shell: bash
        run: dev-exec just verify-m18 2>&1 | tee verify-m18.log

      - name: Collect the round-trip transcript
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts-m18
          cp aztec-avm-runtime/verify-m18.log artifacts-m18/ 2>/dev/null || true
          for f in "${{ github.workspace }}"/m18-work/roundtrip.out \
                   "${{ github.workspace }}"/m18-work/roundtrip.err \
                   "${{ github.workspace }}"/m18-work/m17-measured.env ; do
            [ -f "$f" ] && cp "$f" artifacts-m18/ || true
          done
          ls -la artifacts-m18

      - name: Upload the orchestration artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orchestration
          path: artifacts-m18
          retention-days: 30
