          #
          #     FAIL the host ran the deploy/call/revert roundtrip  expected [0], got [1]
          #     ok   it produced a transcript  [.../m13-work/e2e.out]
          #     e2e_deploy_call_revert_roundtrip: cannot run: the transcript is empty
          #                                       — see .../m13-work/e2e.err
          #     error: recipe `verify-m13` failed with exit code 1
          #
          # The check names the file that explains it, and that file was in `m13-work/` while every
          # line of this step points at `m20-work/`. Worse, because verify-m13 failed first,
          # `verify-m20.log` and `m20-work/` were never written either — so all three `cp`s hit
          # their `|| true`, the directory uploaded EMPTY, and the run's artefact list has no
          # form-a entry at all. The one job whose failure was undiagnosable is the one that
          # published nothing.
          #
          # The `2>/dev/null || true` on every line is deliberate and stays: a collect step must not
          # fail a job. But it means a path that is simply WRONG is indistinguishable from a file
          # that legitimately does not exist, which is why this went unnoticed. `ls -la` below is
          # the only signal, and an empty listing reads as "nothing to collect".
          cp "${{ github.workspace }}"/m13-work/*.out artifacts-m20/ 2>/dev/null || true
          cp "${{ github.workspace }}"/m13-work/*.err artifacts-m20/ 2>/dev/null || true
          cp aztec-avm-runtime/verify-m13.log artifacts-m20/ 2>/dev/null || true
          ls -la artifacts-m20

      - name: Upload the Form A artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-a-external-transactions
          path: artifacts-m20
          retention-days: 30

  noir-call-frames:
    name: Noir call frames — the tree the recorder writes, and the subtrees a view folds
    runs-on: eph-linux-x64
    # THE CHEAPEST JOB IN THIS FILE, ON PURPOSE. It builds no wasm, launches no browser and reaches
    # no network at run time. `test_noir_frames_open_at_function_boundaries` drives
    # `ContractSourceMap.framesFor` and `NoirFrameTracker` — the same code `replay/src/recording.ts`
    # and `browser/src/ct_download.ts` both run — over two things already on disk: the
    # version-matched FeeJuice artifact from `@aztec/protocol-contracts`, and
    # `replay/fixtures/published_snapshot_step_positions.json`, which is the published snapshot
    # container's own decoded step positions.
    #
    # IT NEEDS `npm ci` IN replay/ AND NOTHING ELSE. The artifact is what supplies `brillig_locations`
    # (314 pcs), `location_tree` (155 nodes) and the 726 `function_locations` that NAME a frame, and
    # the check DIES naming that remedy rather than skipping when it is absent. The pin matters:
    # §1 asserts `aztec_version` is `5.3.0-nightly.20260819`, because a different nightly is a
    # different contract with different pcs and would be a green run about nothing.
    #
    # It does NOT clone aztec-packages or codetracer-specs. `verification/lib.sh` only SETS
    # `FORK_ROOT`; nothing on this path reads it.
    #
    # STATUS, STATED PLAINLY, the same way every job above states it: no job in this workflow has
    # ever reached a check — they all still stop at `Generate CI token`, which needs a
    # repository-level `CI_TOKEN_PROVIDER_PRIVATE_KEY` only the user can set. So this job existing
    # means the gate is wired and named, not that a run has ever gated anything.
    timeout-minutes: 30
    steps:
      - name: Preflight — is the secrets context populated at all?
        env:
          CONTROL_PRESENT: ${{ secrets.GITHUB_TOKEN != '' }}
          APP_ID_PRESENT: ${{ vars.CI_TOKEN_PROVIDER_APP_ID != '' }}
          PRIVATE_KEY_PRESENT: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${CONTROL_PRESENT}" != "true" ]; then
            echo "::error::CONTROL FAILED: secrets.GITHUB_TOKEN is empty, so the secrets context is not being populated at all. Nothing this step says about repository configuration is trustworthy; fix the runner or the workflow before reading the messages below."
            exit 2
          fi
          rc=0
          if [ "${APP_ID_PRESENT}" != "true" ]; then
            echo "::error::vars.CI_TOKEN_PROVIDER_APP_ID is empty. Set a REPOSITORY variable: gh variable set CI_TOKEN_PROVIDER_APP_ID --repo metacraft-labs/aztec-avm-runtime --body 3115338"
            rc=1
          fi
          if [ "${PRIVATE_KEY_PRESENT}" != "true" ]; then
            echo "::error::secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY is empty. Set a REPOSITORY secret: gh secret set CI_TOKEN_PROVIDER_PRIVATE_KEY --repo metacraft-labs/aztec-avm-runtime < ci-app-private-key.pem"
            rc=1
          fi
          exit "$rc"

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # The sibling layout `verification/lib.sh` resolves against. Only this repository is needed
      # here, but the path is kept identical to every other job so the checks see one layout.
      - name: Checkout aztec-avm-runtime
        uses: actions/checkout@v4
        with:
          path: aztec-avm-runtime

      - name: Setup Dev Environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Assert the gate's inputs are present
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            aztec-avm-runtime/replay/fixtures/published_snapshot_step_positions.json \
            aztec-avm-runtime/tools/run_noir_frames_arms.mjs \
            aztec-avm-runtime/ct-host/src/noir_frames.ts \
            aztec-avm-runtime/ct-host/src/frame_fold.ts \
            aztec-avm-runtime/verification/test_noir_frames_open_at_function_boundaries.sh ; do
            test -f "$p" || { echo "::error::missing input: $p" >&2; exit 1; }
          done

      - name: Install the published @aztec packages (FeeJuice.json is the artifact under test)
        working-directory: aztec-avm-runtime/replay
        shell: bash
        run: dev-exec npm ci 2>&1 | tail -20

      - name: Type-check the frame logic
        working-directory: aztec-avm-runtime
        shell: bash
        run: |
          dev-exec just typecheck-ct-host 2>&1 | tee typecheck-ct-host.log
          dev-exec just typecheck-replay 2>&1 | tee typecheck-replay.log

      - name: The Noir call-frame gate
        working-directory: aztec-avm-runtime
        env:
          NOIR_FRAMES_WORK: ${{ github.workspace }}/noir-frames-work
        # See the M7 job: `shell: bash` supplies `-o pipefail`, which the default `bash -e {0}` does
        # not, so `| tee` cannot swallow a failure.
        shell: bash
        run: dev-exec just verify-noir-frames 2>&1 | tee verify-noir-frames.log

      - name: Collect transcripts
        if: always()
        run: |
          set -uo pipefail
          mkdir -p artifacts
          cp aztec-avm-runtime/verify-noir-frames.log artifacts/ 2>/dev/null || true
          cp aztec-avm-runtime/typecheck-*.log artifacts/ 2>/dev/null || true
          cp "${{ github.workspace }}"/noir-frames-work/noir-frames.json artifacts/ 2>/dev/null || true
          cp "${{ github.workspace }}"/noir-frames-work/arms.log artifacts/ 2>/dev/null || true
          ls -la artifacts

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noir-call-frames-transcripts
          path: artifacts
          retention-days: 30

  browser-gate:
    name: the browser gate — no Node.js dependencies
    runs-on: eph-linux-x64
    # M28, and it is the campaign's LAST milestone. Every other job in this file gates a
    # capability; this one gates an ABSENCE, which is a different thing to get right. It runs on
    # every push and every pull request to `dev` and `main` (see the `on:` block at the top of this
    # file) rather than on the weekly schedule, because the deliverable says "on EVERY PR, not
    # nightly": a nightly absence check tells you which of the day's merges broke it only after all
    # of them have landed.
    #
    # THE ENTRY POINT IS `just ci-browser-gate` AND THAT IS LOAD-BEARING. It is the same recipe a
    # developer runs locally, so this job cannot drift into being a parallel copy of the gate that
    # tests something slightly different. `verification/ci_browser_gate.sh` asserts that this job
    # invokes that recipe by name, that the recipe's check list and `verify-m28`'s differ by
    # exactly the one check they are meant to differ by, and that neither this job nor the recipe
    # carries a `continue-on-error`, an `|| true` or any environment variable that would turn a
    # failure into a warning.
    #
    # WHAT IT COSTS, AND WHY. The full-flow smoke drives a real headless Chromium against M27's
    # THIRTEENTH-OVERLAY module — the one that exports poseidon2 and grumpkin — because the
    # alternative is a page that downloads 7.9 MB of proving stack to compute a hash, which is what
    # DD-11 forbids and what `verify_public_only_page_never_fetches_barretenberg` measures. So the
    # job builds that module first. A cold barretenberg wasm build is the dominant cost here, not
    # the browser.
    #
    # CHROMIUM COMES FROM NIXPKGS, NOT FROM THE RUNNER IMAGE. `lib_m27_browser.sh` takes chromium
    # from PATH and records the version it ran against rather than assuming one, which is right for
    # a developer's box and not enough for a runner whose image may have no browser at all. `nix
    # shell nixpkgs#chromium` makes the provisioning explicit and reproducible. Demonstrated
    # locally: `nix shell nixpkgs#chromium --command chromium --version` prints
    # `Chromium 151.0.7922.137`, and the gate runs green under it.
    #
    # STATUS, STATED PLAINLY: THIS JOB HAS NEVER RUN, AND NEITHER HAS ANY JOB ABOVE IT. They all
    # still stop at `Generate CI token` — see THE CI TOKEN, DIAGNOSED at the top of this file — and
    # the remaining blocker is a repository-level `CI_TOKEN_PROVIDER_PRIVATE_KEY` that only the
    # user can set. So this job existing means the gate is WIRED and names the checks; it does not
    # mean a run has ever gated anything. Every check it names has been executed locally, in this
    # repository's own dev shell, and the numbers are in M28's section of the milestone file.
    timeout-minutes: 120
    steps:
      - name: Assert the CI-token inputs are present
        shell: bash
        env:
          APP_ID_PRESENT: ${{ vars.CI_TOKEN_PROVIDER_APP_ID != '' }}
          PRIVATE_KEY_PRESENT: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY != '' }}
          CONTROL_PRESENT: ${{ secrets.GITHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "${CONTROL_PRESENT}" != "true" ]; then
            echo "::error::CONTROL FAILED: secrets.GITHUB_TOKEN is empty, so the secrets context is not being populated at all. Nothing this step says about repository configuration is trustworthy; fix the runner or the workflow before reading the messages below."
            exit 2
          fi
          rc=0
          if [ "${APP_ID_PRESENT}" != "true" ]; then
            echo "::error::vars.CI_TOKEN_PROVIDER_APP_ID is empty. Organisation variables do not reach private repositories in this organisation (see THE CI TOKEN, DIAGNOSED at the top of this workflow); set a REPOSITORY variable: gh variable set CI_TOKEN_PROVIDER_APP_ID --repo metacraft-labs/aztec-avm-runtime --body 3115338"
            rc=1
          fi
          if [ "${PRIVATE_KEY_PRESENT}" != "true" ]; then
            echo "::error::secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY is empty. Organisation secrets do not reach private repositories in this organisation; set a REPOSITORY secret: gh secret set CI_TOKEN_PROVIDER_PRIVATE_KEY --repo metacraft-labs/aztec-avm-runtime < ci-app-private-key.pem"
            rc=1
          fi
          exit "$rc"

      - name: Generate CI token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout aztec-avm-runtime
        uses: actions/checkout@v4
        with:
          path: aztec-avm-runtime

      - name: Clone the aztec-packages fork
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/aztec-packages
          ref: aztec-avm-runtime
          path: aztec-packages
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Clone codetracer-specs (the prepared patch series)
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-specs
          ref: latest
          path: codetracer-specs
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Setup Dev Environment
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.app-token.outputs.token }}

      - name: Assert the series base commit is present
        working-directory: aztec-packages
        run: |
          set -euo pipefail
          git fetch --unshallow 2>/dev/null || true
          git rev-parse --verify 233d8e0993^{commit}

      - name: Install the orchestration's published @aztec packages
        working-directory: aztec-avm-runtime/orchestration
        shell: bash
        run: dev-exec npm ci 2>&1 | tail -20

      # WITHOUT THIS, FIVE OF THE GATE'S CHECKS RUN ZERO ASSERTIONS AND A SIXTH FAILS THREE.
      # `m27_esbuild` (lib_m27_browser.sh:162) looks in exactly two places —
      # `spike/node_modules/.bin/esbuild` then `diffsim/node_modules/.bin/esbuild` — and this job
      # installed neither; it installs `orchestration/` and nothing else. So in run 34052439806:
      #
      #     verify_browser_bundle_no_node_builtins:         0 assertion(s), 1 failure(s)
      #     verify_browser_bundle_no_native_deps:           0 assertion(s), 1 failure(s)
      #     verify_verification_code_unreachable_from_browser: 0 assertion(s), 1 failure(s)
      #     verify_browser_entry_points_are_dd5_shaped:     0 assertion(s), 1 failure(s)
      #
      # each dying on `cannot run: esbuild is not installed`, and `verify_npm_pack_no_optional_native`
      # taking three more as `FileNotFoundError: browser/dist/meta.json` — because no bundle is ever
      # built, so the file the census reads does not exist. Those three read `expected [0], got []`,
      # which is an EMPTY command substitution rather than a measured zero; a check that reports `[]`
      # where a count belongs has not found a clean bundle, it has not looked at one.
      #
      # `spike/` and not `diffsim/` because that is the order `m27_esbuild` searches, so this is the
      # one the gate will actually pick up. lib.sh's rule held throughout — every one of these said
      # "cannot run" and FAILED rather than printing a green zero — so the gate was honest about
      # being blind. It was blind all the same, and its coverage here was notional.
      - name: Install spike's packages (this is where the gate's esbuild lives)
        working-directory: aztec-avm-runtime/spike
        shell: bash
        run: dev-exec npm ci 2>&1 | tail -20

      # THE SAME DEFECT AS THE STEP ABOVE, ONE TREE OVER — and the reason the step above says
      # "spike/ and not diffsim/" is about ESBUILD, not about these. The gate's POSITIVE CONTROLS
      # resolve from `diffsim/`: verify_browser_bundle_no_native_deps §6 asserts @aztec/native,
      # @aztec/world-state and @aztec/telemetry-client ARE installed there and walks the graph from
      # them, and verify_verification_code_unreachable_from_browser §5 walks
      # diffsim/src/differential/three_way.test.ts. Both exist to prove the walker can answer the
      # OTHER way — that it reports a native package when a graph really reaches one.
      #
      # Without diffsim/node_modules the bare specifiers do not resolve and the walks return 0 and
      # 17 modules, so in run 34160613484 six control assertions reported an absence that is this
      # job's own omission rather than a property of the tree:
      #
      #     FAIL @aztec/native IS installed in diffsim/   missing directory [.../diffsim/node_modules/@aztec/native]
      #     FAIL …and it is a real walk rather than an empty one   expected >= 50, got [0]
      #     FAIL the walker DOES report @aztec/native when a graph really reaches it   expected [1], got [0]
      #     FAIL …and it is a real walk, not an empty one   expected >= 500, got [17]
      #
      # A control that reads 0 because nothing was installed is not evidence the detector works; it
      # is the detector never having been asked. `spike/` declares the same three packages but is
      # not a substitute — diffsim's own test file is the entry point the second check names.
      - name: Install diffsim's packages (this is where the gate's POSITIVE controls resolve)
        working-directory: aztec-avm-runtime/diffsim
        shell: bash
        run: dev-exec npm ci 2>&1 | tail -20

      - name: Build M27's thirteen-overlay module (poseidon2 and grumpkin out through the reactor)
        working-directory: aztec-avm-runtime
        env:
          # Not $TMPDIR: the build is several gigabytes and a tmpfs /tmp is the wrong place.
          M27_WORK: ${{ github.workspace }}/m27-work
        shell: bash
        run: |
          set -euo pipefail
          dev-exec just avm-wasm-build-m27 2>&1 | tail -20
          test -s "${M27_WORK}/m27/barretenberg/cpp/build-wasm-avm/bin/avm.wasm" \
            || { echo "::error::no module at ${M27_WORK}/m27/.../avm.wasm" >&2; exit 1; }

      - name: THE GATE — just ci-browser-gate
        working-directory: aztec-avm-runtime
        env:
          M27_WORK: ${{ github.workspace }}/m27-work
          M28_WORK: ${{ github.workspace }}/m28-work
        # `shell: bash` rather than the default, which is `bash -e {0}` WITHOUT pipefail: piping
        # into `tee` would otherwise hand the step `tee`'s exit status and a failing gate would
        # report a green job. That is a recorded defect in this campaign, not a precaution.
        #
        # THERE IS NO `continue-on-error` AND NO `if:` ON THIS STEP OR ON THIS JOB. The deliverable
        # is "the gate FAILS THE BUILD. It does not warn, and it is not skippable by a flag", and
        # `verification/ci_browser_gate.sh` reads this file and asserts exactly that.
        shell: bash
        run: |
          set -euo pipefail
          export AVM_WASM_PATH="${M27_WORK}/m27/barretenberg/cpp/build-wasm-avm/bin/avm.wasm"
          # Chromium from nixpkgs rather than from the runner image: the gate drives a REAL
          # browser over the DevTools protocol and there is no substitute for that which would be
          # evidence. `M27_CHROMIUM` is what `lib_m27_browser.sh` reads.
          nix shell nixpkgs#chromium --command bash -c '
            export M27_CHROMIUM="$(command -v chromium)"
            dev-exec just ci-browser-gate' 2>&1 | tee ci-browser-gate.log

      - name: THE GATE'S OWN NUMBERS — per check, so a shrink is visible
        if: always()
        working-directory: aztec-avm-runtime
        shell: bash
        # Printed in its own step because a check that DIES prints no summary line and reads as a
        # SMALLER gate rather than a red one. Seven summary lines are expected; fewer is a finding.
        run: |
          set -uo pipefail
          [ -s ci-browser-gate.log ] || { echo "no gate run to report"; exit 0; }
          grep -E '^[A-Za-z_0-9][A-Za-z_0-9 .-]*: [0-9]+ assertion\(s\), [0-9]+ failure\(s\)$' ci-browser-gate.log || true
          echo "--- summary lines: $(grep -cE '^[A-Za-z_0-9][A-Za-z_0-9 .-]*: [0-9]+ assertion\(s\), [0-9]+ failure\(s\)$' ci-browser-gate.log || true) (expected 7)"

      - name: Collect the gate's artefacts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts-m28
          cp aztec-avm-runtime/ci-browser-gate.log artifacts-m28/ 2>/dev/null || true
          cp aztec-avm-runtime/browser/dist/chunks.json artifacts-m28/ 2>/dev/null || true
          cp "${{ github.workspace }}"/m28-work/scan-*.tsv artifacts-m28/ 2>/dev/null || true
          cp "${{ github.workspace }}"/m27-work/browser.stderr artifacts-m28/ 2>/dev/null || true
          ls -la artifacts-m28

      - name: Upload the gate's artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-gate
          path: artifacts-m28
          retention-days: 30
