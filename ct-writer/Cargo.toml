[package]
name = "aztec-ct-writer"
version = "0.0.0"
edition = "2021"
publish = false
description = "The CodeTracer `.ct` writer, compiled to wasm32 with a raw C ABI and zero wasm imports"

[lib]
crate-type = ["cdylib", "rlib"]

# ---------------------------------------------------------------------------
# THREE PATH DEPENDENCIES INTO ONE CHECKOUT, AND THAT IS THE POINT.
#
# `build-wasm-deps/ctf` is materialised by `verification/build_ct_writer_wasm.sh` with
# `git archive <rev>` out of `codetracer-trace-format`'s OBJECT STORE, at the revision
# `pins.json` declares as the `trace_format` anchor. It is a build input, not a vendored copy:
# nothing here is edited, `PROVENANCE.md` has no row for it, and RI-42's decision is `depend`.
#
# Two copies of `codetracer_trace_types` on different paths are TWO DISTINCT TYPES and will not
# unify -- `ValueRecord` from one is not `ValueRecord` from the other, and the error surfaces far
# from its cause. `noir-wt4-webpage/Cargo.toml:175` records hitting exactly this, and records that
# `[patch.crates-io]` cannot express the constraint either. One checkout, three paths into it, is
# what does express it, and `test_single_trace_types_instantiation` measures the result rather
# than trusting this comment.
#
# `codetracer_ctfs` is NOT named here and that is deliberate rather than an omission: it is
# `codetracer_trace_writer`'s own dependency, declared inside that checkout as `path = "../codetracer_ctfs"`,
# so naming it again here could only introduce a second path to the same crate. The
# single-instantiation check asserts it appears exactly once in the lock file all the same,
# because "we did not name it twice" is not evidence about what cargo resolved.
[dependencies]
codetracer_trace_types = { path = "build-wasm-deps/ctf/codetracer_trace_types", optional = true }
codetracer_trace_writer = { path = "build-wasm-deps/ctf/codetracer_trace_writer", optional = true }

# ---------------------------------------------------------------------------
# THE PATH A / PATH B SEAM.
#
# DD-7 named two writers and this crate could express only one of them: there was no `[features]`
# block, no `cfg`, and `CtfsTraceWriter` was hard-linked at the type level in two places. M41
# CREATED this seam rather than flipping one.
#
# ---------------------------------------------------------------------------
# THE DEFAULT IS `path-a`, AND FLIPPING IT WAS TRIED AND MEASURED RATHER THAN DECLINED.
#
# M41's goal is that this runtime writes through the Nim writer, and `path-b` is the writer that
# should win on the merits: `ruzstd`, which Path A links, returns 4,194,304 bytes of wrong data
# where C libzstd refuses a frame corrupted under a content checksum; Path A has no in-memory
# reader, which a browser needs because it holds bytes and no path; and Path A stamps `meta.dat`
# version 3 while Path B stamps 4. Size is not the reason for anything here — Path B's module is
# 480,833 bytes larger and that was known when the decision was taken.
#
# THE FLIP WAS MADE AND MEASURED TWICE, and the second time the blockers under it were fixed first.
#
# First attempt — `default = ["path-b"]` alone, every M41 check green:
#
#   m24  350 assertions, 14 failures -> 350, 58   (+44)
#   m25  456 assertions,  0 failures -> 456, 15   (+15)
#   m40  145 assertions, 12 failures -> 145, 26   (+14)
#   m38  107,  4  and  m39  80, 10   -> UNCHANGED
#
# Second attempt — the reader anchor advanced WITH it (a v4 reader refuses the v3 container the old
# default writes, so neither moves alone), M24's roundtrip control redesigned property-first, and
# `ct-print`'s two output schemas reconciled by a shared decoder:
#
#   m40  145, 12 -> 145, 10   (BETTER than baseline)
#   m24  356, 15 -> 356, 43
#   m25  456,  0 -> 456, 49
#
# Every assertion COUNT is unchanged in both, so nothing structural moved. The FIRST attempt failed
# on one thing: this repository verifies every container it writes with a version-3-era `ct-print`,
# which on M24's own 4.6 MB Path B container reports 0 events, an empty program and 1,830 steps
# where there are 250,001 — and does NOT refuse, it answers.
#
# What remains after the SECOND attempt is not a defect in either writer. M24's and M25's content
# assertions are CONSTANTS DESCRIBING PATH A'S CONTAINER SHAPE — exactly N steps, exactly one
# `Call`, exactly one `Function`, the first step at pc 0, five variables on step 0. The Nim
# writer's `start()` emits a step and interns no top-level function, so every one of them is off by
# the start-step and the toplevel frame, and both are differences `WRITER-SEAM.md` §5 already
# catalogues WITH REASONS. Re-expressing them is re-deciding what M24 measures.
#
# So the flip is blocked on a PIN, not on a writer, and the pin is the one M41 was told not to
# move: `trace_format_nim` names a commit deliberately so `test_ct_container_roundtrip_ct_print`'s
# reader difference stays at ONE commit, and its control is that commit's parent. Moving it
# forward makes the control `8cfb1bb`, which READS a v4 container, so the check's "the parent must
# not read it" arm has to be re-designed rather than re-pointed.
#
# **The default therefore stays `path-a`.** Shipping v3 is a LOUD failure downstream — current
# readers refuse it by name — whereas shipping v4 today would leave this repository verifying its
# own containers against writer-specific constants that do not describe them, which trades a
# refusal for a silence.
#
# Everything the two attempts left behind is KEPT, because all of it is an improvement under either
# writer: the property-first control, the schema-agnostic decoder, both explicit build arms, and
# the C toolchain exports. `WRITER-SEAM.md` §9, §9c, §9d and §9e carry the full measurement and the
# named follow-ups.
#
# `path-b` WINS WHEN BOTH ARE ON, and that precedence is declared here rather than left for a
# reader to derive from `cfg` polarity in `backend.rs`. Cargo features are additive — nothing can
# turn `path-a` off — so "both on" is a state that arises without anyone asking for it, and the
# build must have an answer.
# ---------------------------------------------------------------------------
#
# The Path A dependencies are OPTIONAL and gated on `path-a`, which is not tidiness: with them
# unconditional, a `--no-default-features --features path-b` build would still compile and link the
# entire pure-Rust writer into a module that never calls it, and the size figure that build reports
# would be a figure about two writers. `verify_ruzstd_checksum_defect_absent_from_shipped_path`
# measures the result rather than trusting this comment: it asserts the Path B module contains no
# `ruzstd` at all, with the Path A module as the control that says the search can find one.
#
# `path-b` names no dependency at all. Its writer is not a crate: it is Nim source, materialised
# and compiled by `build.rs` at the revision `pins.json` declares as `trace_format_nim_writer`, and
# linked as a static library. That is why the feature list looks lopsided.
[features]
default = ["path-a"]
path-a = ["dep:codetracer_trace_types", "dep:codetracer_trace_writer"]
path-b = []

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = true
